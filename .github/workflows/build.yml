name: Native test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libegl1-mesa-dev fonts-noto-cjk
      - name: Rust native toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add ${{ matrix.target }}
          rustc -vV
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Source and configuration checks
        run: python scripts/check_source.py
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Unit and integration tests
        shell: bash
        env:
          RUST_BACKTRACE: '1'
        run: |
          mkdir -p test-results
          set -o pipefail
          cargo test --workspace --all-targets --locked --target ${{ matrix.target }} 2>&1 | tee test-results/${{ matrix.target }}.log
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.target }}
          path: test-results/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Native release build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Package client and receiver
        run: python scripts/package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: metadefender-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lockfile-${{ matrix.target }}
          path: Cargo.lock
